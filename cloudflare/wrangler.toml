name = "lrcshare-open-api"
main = "open-api.js"
compatibility_date = "2024-09-01"

# Secrets（部署前用 `wrangler secret put` 设置，勿写进本文件）：
#   SUPABASE_URL       形如 https://xxxx.supabase.co（不带尾斜杠）
#   SUPABASE_ANON_KEY  anon key（仅 anon，service_role 禁止配置）
#   SESSION_SECRET     HMAC 签名密钥，用于签发/校验 session_token（随机长字符串）

# KV 命名空间绑定（需先 `wrangler kv:namespace create API_KV` 创建）
[[kv_namespaces]]
binding = "API_KV"
id = "337bea7013504935b1a874cc99796b3a"
