# LrcShare 邮件服务站点配置（仅部署 Netlify Functions，前台主站走 GitHub Pages）
# 部署：将本仓库接入 Netlify（站点任意命名），环境变量配置：
#   SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY
#   （mailer 需 service_role 绕过 RLS 读 settings 表的 smtp 配置；anon 读不到会 fail-closed）
# 前端通过 VITE_MAIL_BASE 指向本站点地址（如 https://mail.lrcshare.netlify.app）

[build]
  command = "echo 'mail functions only'"
  publish = "netlify/static"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# /api/mailer → function（与前端 callMailServer('/api/mailer') 对应）
[[redirects]]
  from = "/api/mailer"
  to = "/.netlify/functions/mailer"
  status = 200
  force = true

# /api/resolve-music → function（歌曲分享投稿：平台链接/嵌入代码识别 + 专辑曲目清单）
[[redirects]]
  from = "/api/resolve-music"
  to = "/.netlify/functions/resolve-music"
  status = 200
  force = true

# /api/music-stream → function（歌曲分享播放：网易云曲目实时换取时效直链）
[[redirects]]
  from = "/api/music-stream"
  to = "/.netlify/functions/music-stream"
  status = 200
  force = true

# /api/music-lyric → function（歌曲分享播放：网易云歌词实时获取，不入库）
[[redirects]]
  from = "/api/music-lyric"
  to = "/.netlify/functions/music-lyric"
  status = 200
  force = true
