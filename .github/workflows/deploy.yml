# 构建 v3 前台（vite-ssg 预渲染 558+ 页）并部署到 GitHub Pages
# 前置配置：
#   1. 仓库 Settings → Pages → Build and deployment → Source 选「GitHub Actions」
#   2. 仓库 Settings → Secrets and variables → Actions 添加三个 secret：
#      VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY / VITE_MAIL_BASE（Netlify 邮件站点地址）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 定时构建：每 6 小时（UTC 0/6/12/18 点 = 北京时间 8/14/20/2 点）
    # 数据库新增/修改内容后，最迟 6 小时内自动上线（含首页快照与歌曲/艺术家详情页）
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持手动触发（Actions 页面 Run workflow）

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Secrets 缺失时提前给人话报错（否则 vite-ssg 深处抛「缺少 Supabase 环境变量」难排查）
      - name: Check required secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::缺少 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY。请到 Settings → Secrets and variables → Actions → New repository secret 配置后重跑本工作流"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build (SSG)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAIL_BASE: ${{ secrets.VITE_MAIL_BASE }}

      # GitHub Pages 404 兜底：/404 路由已由 vite-ssg 预渲染为 dist/404.html（真实 404 页，无首页闪烁），
      # 未知路径返回它（状态码 404），SPA 水合后由 catch-all 路由接管；仅当构建异常缺失时回退首页副本
      - name: Ensure 404.html fallback
        run: test -f dist/404.html || cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
